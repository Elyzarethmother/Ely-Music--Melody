name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Prepare environment and keystore
        run: |
          # 1. Restore debug keystore from base64 if present
          if [ -f debug.keystore.base64 ] && [ -s debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
          fi
          # 2. If debug.keystore is still missing or empty, generate fallback
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore with keytool..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # 3. Verify debug keystore
          ls -la debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey
          # 4. Prepare .env configuration
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: symphonia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
